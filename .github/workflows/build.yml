name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generer le dossier Android
        run: flutter create --platforms=android --project-name jamendo_player .

      - name: Autoriser Internet et nommer l'appli Home
        run: |
          sed -i -e 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application android:usesCleartextTraffic="true"#' android/app/src/main/AndroidManifest.xml
          sed -i -e 's#android:label="[^"]*"#android:label="Home"#' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      - name: Icone de l'appli (sans bloquer le build si ca echoue)
        continue-on-error: true
        run: dart run flutter_launcher_icons

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: home-apk
          path: build/app/outputs/flutter-apk/app-release.apk
